<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">KitsuneGate</title>
  <desc id="desc">A fox guardian framed by a network gateway with three converging routes.</desc>
  <defs>
